sz:{c:"Śniadanie",n:"Szakszuka ze szpinakiem i fetą",t:20,kcal:635,p:51,zn:4.5,k:2000,na:1000,q:[["jaj",3],["bial",150],["passata",300],["szpinak",100],["cebula",.5],["papryka",.5],["czosnek",1],["feta",30],["oliwa",5],["harissa",1],["chleb",40],["kumin",0],["papwed",0],["sol",0]],st:["Na oliwie zeszklij pokrojoną cebulę i paprykę (5 min).","Dodaj czosnek, kumin, wędzoną paprykę i harissę, smaż 30 s.","Wlej passatę, gotuj 5 min, dopraw solą i pieprzem.","Wmieszaj szpinak i białka, mieszaj 1-2 min, aż białka się zetną.","Zrób 3 dołki, wbij jajka, przykryj i trzymaj na małym ogniu 5-6 min.","Posyp pokruszoną fetą, podawaj z chlebem."]},
ow:{c:"Śniadanie",n:"Owsianka szarlotkowa z pestkami dyni",t:12,kcal:670,p:60,zn:5.1,k:1040,na:300,q:[["owies",70],["odz",30],["skyr",200],["jablko",1],["pestki",15],["cynamon",0],["gozdzik",0],["sol",0]],st:["Płatki zalej 250 ml wody, dodaj szczyptę soli, gotuj 4-5 min.","Jabłko pokrój w kostkę, podsmaż na suchej patelni z cynamonem i szczyptą mielonego goździka (4 min).","Na tej samej patelni upraż pestki dyni (2 min, aż zaczną strzelać).","Zdejmij płatki z ognia, odczekaj minutę i wmieszaj odżywkę (we wrzątku się zwarzy).","Na wierzch skyr, jabłko i pestki."]},
br:{c:"Śniadanie",n:"Burrito z czarną fasolą i jajkami",t:15,kcal:630,p:47,zn:4.1,k:1190,na:1100,q:[["tort",1],["jaj",2],["bial",150],["fasolaz",80],["serl",30],["awok",.33],["pomidor",1],["limonka",.5],["kolendra",.25],["kumin",0],["sol",0]],st:["Fasolę odsącz, rozgnieć widelcem z kuminem, solą i łyżką wody, podgrzej.","Salsa: pomidor w kostce, sok z limonki, kolendra, sól.","Jajka roztrzep z białkami, zetnij na patelni na małym ogniu, mieszając.","Na tortillę fasola, jajka, starty ser, awokado i salsa.","Zwiń, przypiecz na suchej patelni po 1 min z każdej strony."]},
tw:{c:"Śniadanie",n:"Twaróg po wiejsku z łososiem wędzonym",t:8,kcal:640,p:61,zn:2.5,k:1080,na:1400,q:[["twar",250],["loswed",50],["rzodk",.5],["szczyp",.25],["koperek",.25],["pomidor",1],["chleb",80],["maslo",10],["sol",0],["pieprz",0]],st:["Twaróg rozgnieć z 2-3 łyżkami wody mineralnej, sól i pieprz.","Dodaj posiekany szczypiorek, koperek i pokrojoną rzodkiewkę.","Chleb posmaruj masłem, ułóż łososia.","Podawaj z pomidorem."]},
tm:{c:"Obiad",n:"Kurczak tikka masala ze szpinakiem",t:30,kcal:820,p:73,zn:4.1,k:2190,na:800,q:[["kurczak",220],["jog",100],["cebula",1],["czosnek",2],["imbir",10],["passata",200],["szpinak",100],["smi",50],["olej",5],["ryz",75],["garam",0],["sol",0]],st:["Dzień wcześniej: kurczaka w kostce wymieszaj z jogurtem, garam masalą, startym imbirem, połową czosnku i solą.","Ryż wypłucz i ugotuj (1,5 szklanki wody na szklankę ryżu, 12 min pod przykryciem).","Kurczaka z marynatą rozłóż na blasze, piecz 15 min w 220°C albo smaż na mocnym ogniu do zrumienienia.","Na oleju zeszklij cebulę z resztą czosnku, dodaj łyżeczkę garam masali, smaż 30 s, wlej passatę i gotuj 10 min.","Dodaj śmietanę, szpinak i kurczaka, gotuj 3 min, dopraw solą."]},
bg:{c:"Obiad",n:"Wołowina bulgogi z kimchi",t:25,kcal:715,p:60,zn:11,k:1100,na:1600,q:[["wol",200],["sossoj",2],["gruszka",.25],["czosnek",2],["imbir",10],["olejsez",5],["ryz",75],["edamame",60],["kimchi",80],["ogorek",.5],["sezam",5]],st:["Gruszkę zetrzyj, wymieszaj z sosem sojowym, czosnkiem, imbirem i olejem sezamowym.","Wołowinę pokrój jak najcieniej (łatwiej, gdy jest lekko zmrożona), marynuj min. 30 min.","Ugotuj ryż, edamame wrzuć na 4 min do wrzątku.","Wołowinę smaż na bardzo gorącej patelni partiami po 1-2 min, żeby się nie dusiła.","Podawaj na ryżu z kimchi, ogórkiem i edamame, posyp sezamem."]},
ch:{c:"Obiad",n:"Chili con carne z indykiem i pestkami dyni",t:40,kcal:735,p:66,zn:6.8,k:2300,na:800,q:[["indykm",200],["cebula",1],["czosnek",2],["fasolac",100],["kukur",50],["pomp",400],["kakao",5],["olej",5],["ryz",40],["jog",30],["pestki",15],["limonka",.5],["kolendra",.25],["kumin",0],["chipotle",0],["sol",0]],st:["Cebulę i czosnek zeszklij na oleju.","Dodaj mięso, smaż na mocnym ogniu do zrumienienia, rozbijając grudki.","Dodaj kumin, chipotle i kakao, smaż 1 min.","Wlej pomidory, dodaj fasolę i kukurydzę, duś 25 min pod przykryciem, dopraw solą.","Podawaj na ryżu z jogurtem, prażonymi pestkami dyni, limonką i kolendrą. Rób podwójną porcję do zamrażarki."]},
lo:{c:"Obiad",n:"Łosoś z masłem miso, ziemniaki, fasolka",t:30,kcal:745,p:59,zn:2.6,k:2300,na:800,q:[["losos",170],["miso",5],["maslo",5],["ziemn",250],["fasolka",200],["skyr",150],["koperek",.5],["czosnek",1],["sol",0]],st:["Ziemniaki ugotuj w skórce w osolonej wodzie (20 min).","Masło wymieszaj z pastą miso, posmaruj łososia.","Piecz łososia 12 min w 200°C.","Fasolkę gotuj na parze 6-7 min, posól.","Sos: skyr, posiekany koperek, przeciśnięty czosnek, sól."]},

function chart(log){
 if(log.length<2)return "";
 const W=320,H=150,P=24,xs=log.map(x=>new Date(x.d+"T12:00:00").getTime()),ys=log.map(x=>x.kg);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(PC.goal-2,...ys)-1,y1=Math.max(...ys)+1;
 const X=v=>P+(v-x0)/((x1-x0)||1)*(W-P-8),Y=v=>8+(y1-v)/(y1-y0)*(H-8-P);
 const pts=log.map((x,i)=>X(xs[i]).toFixed(1)+","+Y(x.kg).toFixed(1)).join(" ");
 return `<svg class="ch" viewBox="0 0 ${W} ${H}"><line x1="${P}" x2="${W-8}" y1="${Y(PC.goal)}" y2="${Y(PC.goal)}" stroke="#ff4d00" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-10}" y="${Y(PC.goal)-4}" fill="#ff4d00" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="end">CEL ${PC.goal}</text>
 <text x="2" y="${Y(y1-1)+4}" fill="#6d6c64" font-size="10" font-family="JetBrains Mono,monospace">${(y1-1).toFixed(0)}</text><text x="2" y="${Y(y0+1)+4}" fill="#6d6c64" font-size="10" font-family="JetBrains Mono,monospace">${(y0+1).toFixed(0)}</text>
 <polyline points="${pts}" fill="none" stroke="#141414" stroke-width="1.8" stroke-linejoin="round"/>${log.map((x,i)=>`<circle cx="${X(xs[i])}" cy="${Y(x.kg)}" r="2.8" fill="#ff4d00"/>`).join("")}</svg>`;
}

document.getElementById("app").addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;e.preventDefault();
 const a=b.dataset.a,[k,...r]=a.split(":"),v=r.join(":"),ds=iso(curDate());
 if(k==="off"){st.off=v==="0"?0:st.off+(+v)}
 else if(k==="ck"){setOn(ds,v,!isOn(ds,v))}
 else if(k==="go"){const [t,x]=v.split(":");if(t==="train"){st.wk=x;setTab("train");return}if(t==="mob"){st.mob=x;setTab("mob");return}if(t==="rec"){st.dv="rec";st.open["rc_"+x]=true;st.tab="diet";render();const el=document.getElementById("r-"+x);if(el)el.scrollIntoView();return}}
 else if(k==="wk"){st.wk=v}
 else if(k==="mode"){S.set("mode",v)}
 else if(k==="mob"){st.mob=v}
 else if(k==="dd"){st.dd=+v}
 else if(k==="dv"){st.dv=v}
 else if(k==="op"){st.open[v]=!st.open[v];if(st.open[v])st.last3=v}
 else if(k==="sn"){st.shopN=+v}
 else if(k==="sf"){st.shopFrom=+v}
 else if(k==="sw"){st.shopWho=v}
 else if(k==="cam"){if(V3.active)V3.active.set(v);return}
 else if(k==="rmsave"){const w=parseFloat(String(document.getElementById("rmw_"+v).value).replace(",",".")),r=parseInt(document.getElementById("rmr_"+v).value,10);if(w>0&&r>0&&r<=20){const o=S.get("rm",{});o[v]={w,r,d:iso(new Date())};S.set("rm",o);Object.keys(st.open).forEach(x=>{if(x.startsWith("ts_")&&x.endsWith("_"+v))st.open[x]=false})}}
 else if(k==="pick"){const [slot,id]=v.split(":");const o=S.get("sel",{});if(id)o[slot]=id;else delete o[slot];S.set("sel",o);const [gg,ii]=slot.split("-");st.open["sw_"+gg+"_"+ii]=false}
 else if(k==="mf"){st.mf=v}
 else if(k==="sc"){const o=S.get("shopck",{});o[v]=!o[v];S.set("shopck",o)}
 else if(k==="shopclr"){S.set("shopck",{})}
 else if(k==="shopcopy"){copyText(shopText(),document.getElementById("shm"),document.getElementById("shtx"));return}
 else if(k==="set"){const [sid,n]=v.split(":");const cur=+((chk()[ds]||{})[sid]||0);setOn(ds,sid,cur>=+n?(+n-1):+n)}
 else if(k==="tm"){const i=v.indexOf(":");openTimer(+v.slice(0,i),v.slice(i+1));return}
 else if(k==="cp"){const o=S.get("cp",{});o[v]=!o[v];S.set("cp",o)}
 else if(k==="del"){S.set("log",S.get("log",[]).filter(x=>x.d!==v))}
 else if(k==="hideinst"){S.set("hideInst",true)}
 else if(k==="install"){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()})}return}
 else if(k==="exp"){const keys=["chk","wt","log","cp","tests","start","mode","rm","sel"],o={};keys.forEach(x=>o[x]=S.get(x,null));copyText(JSON.stringify(o),document.getElementById("bkm"),document.getElementById("bk"));return}
 else if(k==="imp"){const m=document.getElementById("bkm");try{const o=JSON.parse(document.getElementById("bk").value);Object.keys(o).forEach(x=>{if(o[x]!==null)S.set(x,o[x])});m.textContent="Wczytano.";render()}catch(err){m.textContent="Nie udało się odczytać tekstu."}return}
 render();
});
/* ================= minutnik ================= */
let tmr={left:0,total:0,id:null};
const ov=document.getElementById("ov"),ovt=document.getElementById("ovt"),ovp=document.getElementById("ovp");
function openTimer(sec,label){clearInterval(tmr.id);tmr={left:sec,total:sec,id:null};document.getElementById("ovl").textContent=label;ovt.textContent=sec;ovp.textContent="Start";ov.classList.add("on")}
function tick(){tmr.left--;ovt.textContent=Math.max(0,tmr.left);if(tmr.left<=0){clearInterval(tmr.id);tmr.id=null;ovp.textContent="Start";ovt.textContent="Koniec";try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}}
ovp.addEventListener("click",()=>{if(tmr.id){clearInterval(tmr.id);tmr.id=null;ovp.textContent="Wznów"}else{if(tmr.left<=0){tmr.left=tmr.total;ovt.textContent=tmr.left}tmr.id=setInterval(tick,1000);ovp.textContent="Pauza"}});
document.getElementById("ovr").addEventListener("click",()=>{clearInterval(tmr.id);tmr.id=null;tmr.left=tmr.total;ovt.textContent=tmr.left;ovp.textContent="Start"});
document.getElementById("ovx").addEventListener("click",()=>{clearInterval(tmr.id);tmr.id=null;ov.classList.remove("on")});
Object.assign(M_CFG,{DAYPLAN,ROT,EVE,CP,PHN,PHNOTE});
applyProfile(S.get("profile","m")==="k"?"k":"m");st.shopWho=PID;
document.getElementById("profbtn").addEventListener("click",()=>{applyProfile(PID==="m"?"k":"m");S.set("profile",PID);st.wk=null;st.dd=null;st.shopWho=PID;st.open={};render();window.scrollTo(0,0)});
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
